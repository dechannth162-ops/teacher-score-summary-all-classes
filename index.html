const yearNode = document.getElementById('year');
if (yearNode) yearNode.textContent = new Date().getFullYear();
let toastTimer;
function showToast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
document.querySelectorAll('.room-card').forEach(card=>{
  card.addEventListener('pointermove',event=>{
    const rect=card.getBoundingClientRect();
    card.style.setProperty('--mx',`${((event.clientX-rect.left)/rect.width)*100}%`);
    card.style.setProperty('--my',`${((event.clientY-rect.top)/rect.height)*100}%`);
  },{passive:true});
  card.addEventListener('click',event=>{
    const rect=card.getBoundingClientRect();
    const ripple=document.createElement('span');
    ripple.className='ripple';
    ripple.style.left=`${event.clientX ? event.clientX-rect.left : rect.width/2}px`;
    ripple.style.top=`${event.clientY ? event.clientY-rect.top : rect.height/2}px`;
    card.appendChild(ripple);
    ripple.addEventListener('animationend',()=>ripple.remove(),{once:true});
    const room=card.dataset.room;const url=(ROOM_LINKS[room]||'').trim();
    if(url){window.open(url,'_blank','noopener,noreferrer');}
    else{showToast('ยังไม่ได้ตั้งค่าลิงก์: '+room);}
  });
});

 const intro=document.getElementById('intro'), progress=document.getElementById('intro-progress');let ended=false;
 function finish(){if(ended)return;ended=true;intro.classList.add('hidden');document.body.classList.add('intro-complete');if(window.gsap){gsap.fromTo('.hero-copy',{y:22,opacity:0},{y:0,opacity:1,duration:.75,ease:'power3.out',delay:.05});gsap.fromTo('#portrait-wrap',{y:28,opacity:0,scale:.94},{y:0,opacity:1,scale:1,duration:.9,ease:'back.out(1.5)',delay:.15});gsap.fromTo('.room-card',{y:17,opacity:0},{y:0,opacity:1,duration:.45,stagger:.045,ease:'power2.out',delay:.25});gsap.fromTo('.topbar',{y:-12,opacity:0},{y:0,opacity:1,duration:.5,ease:'power2.out'});}else{document.querySelectorAll('.hero-copy,#portrait-wrap,.room-card,.topbar').forEach(el=>el.style.opacity='1');}}

// Three.js / WebGL scene: full-screen molecular helix field + flowing plasma ribbons.
// No central sphere: the entire background is populated by multiple animated helices.
(async function initWebGL(){
 const canvas=document.getElementById('webgl-bg');
 const fallback=document.getElementById('helix-fallback');
 const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
 function showFallback(){
  if(!fallback)return;
  fallback.style.display='block';
  const count=2;
  if(fallback.dataset.count===String(count))return;
  fallback.dataset.built='true';fallback.dataset.count=String(count);fallback.replaceChildren();
  const svgNS='http://www.w3.org/2000/svg';
  for(let i=0;i<2;i++){
   const svg=document.createElementNS(svgNS,'svg');svg.setAttribute('viewBox','0 0 1200 220');svg.setAttribute('preserveAspectRatio','none');svg.classList.add('fallback-helix');
   svg.style.left='-2%';svg.style.width='104%';svg.style.height='42%';svg.style.top=(i===0?'7%':'51%');svg.style.setProperty('--tilt','0deg');svg.style.animationDelay=(-i*1.7)+'s';
   const pathFor=(phase,flip)=>{let d='';for(let x=0;x<=1200;x+=4){const y=110+Math.sin(x*.035+phase+(flip?Math.PI:0))*53;d+=(x===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)+' ';}return d;};
   [[0,i%2?'#ff8d3c':'#ff6426',5,.9],[Math.PI,i%2?'#39dfff':'#5adfff',4,.82]].forEach(([phase,color,width,opacity],n)=>{const path=document.createElementNS(svgNS,'path');path.setAttribute('d',pathFor(phase,n===1));path.setAttribute('fill','none');path.setAttribute('stroke',color);path.setAttribute('stroke-width',width);path.setAttribute('stroke-linecap','round');path.setAttribute('opacity',opacity);path.style.filter='drop-shadow(0 0 7px '+color+')';path.style.animation='fallback-pulse '+(2.8+n*.8)+'s ease-in-out infinite';path.style.animationDelay=(-i*.8-n*.4)+'s';svg.appendChild(path);});
   for(let x=20;x<1200;x+=26){const y1=110+Math.sin(x*.035)*53,y2=110+Math.sin(x*.035+Math.PI)*53;const line=document.createElementNS(svgNS,'line');line.setAttribute('x1',x);line.setAttribute('y1',y1);line.setAttribute('x2',x);line.setAttribute('y2',y2);line.setAttribute('stroke','#ffbd7a');line.setAttribute('stroke-width','2');line.setAttribute('opacity','.48');svg.appendChild(line);[[y1,'#ff9b49'],[y2,'#43dcff']].forEach(([y,color])=>{const atom=document.createElementNS(svgNS,'circle');atom.setAttribute('cx',x);atom.setAttribute('cy',y);atom.setAttribute('r','4.2');atom.setAttribute('fill',color);atom.setAttribute('opacity','.86');atom.style.filter='drop-shadow(0 0 5px '+color+')';atom.style.animation='fallback-node-pulse 1.8s ease-in-out infinite';atom.style.animationDelay=(-x*.006-i*.4)+'s';svg.appendChild(atom);});}
   fallback.appendChild(svg);
  }
 }
 showFallback();
 window.addEventListener('resize',()=>{if(fallback&&fallback.style.display==='block')showFallback();},{passive:true});
 try{
  const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,.1,120);
  camera.position.set(0,0,16);
  const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setClearColor(0x070910,0);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.12;
  scene.add(new THREE.AmbientLight(0x7b99b5,.75));
  const glowOrange=new THREE.PointLight(0xff571d,7,36,1.5);glowOrange.position.set(-4,2,4);scene.add(glowOrange);
  const glowCyan=new THREE.PointLight(0x1cbfe4,5,34,1.6);glowCyan.position.set(5,-2,2);scene.add(glowCyan);

  const helixField=new THREE.Group();scene.add(helixField);
  const plasmaField=new THREE.Group();scene.add(plasmaField);
  const strandMaterials=[];
  const plasmaMaterials=[];
  const helixes=[];
  const tubeSphere=new THREE.SphereGeometry(1,12,10);
  const atomMaterials=[
   new THREE.MeshStandardMaterial({color:0xff7a2c,emissive:0xff4b17,emissiveIntensity:1.5,metalness:.36,roughness:.22,transparent:true,opacity:.94}),
   new THREE.MeshStandardMaterial({color:0x65e8ff,emissive:0x00aeea,emissiveIntensity:1.35,metalness:.25,roughness:.2,transparent:true,opacity:.9}),
   new THREE.MeshStandardMaterial({color:0xffc46b,emissive:0xff7b20,emissiveIntensity:1.35,metalness:.35,roughness:.23,transparent:true,opacity:.9}),
   new THREE.MeshStandardMaterial({color:0x8ab7ff,emissive:0x297bff,emissiveIntensity:1.1,metalness:.28,roughness:.25,transparent:true,opacity:.88})
  ];
  const bridgeMaterial=new THREE.LineBasicMaterial({color:0xffa65d,transparent:true,opacity:.44,blending:THREE.AdditiveBlending,depthWrite:false});
  const palettePairs=[[0,1],[2,0],[1,3],[0,2],[3,1],[2,1],[0,3],[1,2]];
  let worldW=0,worldH=0,particleSystem=null,particleGeometry=null,particleBase=null,particleSeed=null,sparkSystem=null,sparkGeometry=null,sparkBase=null;

  function visibleWorld(){
   const h=2*camera.position.z*Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
   return {h,w:h*camera.aspect};
  }
  function makeStrandMaterial(color,phase,opacity){
   const mat=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:phase},uColor:{value:new THREE.Color(color)},uPhase:{value:phase},uOpacity:{value:opacity}},
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,toneMapped:false,
    vertexShader:`varying vec2 vUv; varying vec3 vViewPosition; void main(){vUv=uv;vec4 mv=modelViewMatrix*vec4(position,1.0);vViewPosition=-mv.xyz;gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform float uTime;uniform vec3 uColor;uniform float uPhase;uniform float uOpacity;varying vec2 vUv;varying vec3 vViewPosition;void main(){float flow=pow(max(0.0,sin(vUv.x*19.0-uTime*1.65+uPhase+sin(vUv.x*7.0+uPhase)*0.7)),7.0);float pulse=0.73+0.27*sin(vUv.x*5.5-uTime*0.8+uPhase);float rim=0.62+0.38*pow(abs(sin(vUv.y*6.283)),3.0);vec3 col=uColor*(0.45+flow*1.65)*rim;float alpha=(0.38+flow*0.52)*pulse*uOpacity;gl_FragColor=vec4(col,alpha);}`
   });
   strandMaterials.push(mat);return mat;
  }
  function helixPoints(xMin,xMax,samples,radius,phase,offset){
   const a=[],b=[];
   for(let j=0;j<=samples;j++){
    const f=j/samples,x=xMin+(xMax-xMin)*f;
    const turn=f*Math.PI*2*7.2+phase;
    const breathing=1+0.08*Math.sin(f*Math.PI*8+phase*.7);
    const r=radius*breathing;
    a.push(new THREE.Vector3(x,Math.cos(turn)*r,Math.sin(turn)*r*.68+offset));
    b.push(new THREE.Vector3(x,Math.cos(turn+Math.PI)*r,Math.sin(turn+Math.PI)*r*.68+offset));
   }
   return [a,b];
  }
  function buildHelixes(){
   helixes.forEach(h=>{
    helixField.remove(h.group);
    h.group.traverse(o=>{if(o.geometry && o.geometry!==tubeSphere)o.geometry.dispose();});
    h.mats.forEach(m=>{m.dispose();const idx=strandMaterials.indexOf(m);if(idx>=0)strandMaterials.splice(idx,1);});
   });
   helixes.length=0;
   const {w,h}=visibleWorld();worldW=w;worldH=h;
   const samples=320,beadStep=8;
   const amp=clamp(h*.105,.72,1.35);
   const xMin=-w*.49,xMax=w*.49;
   for(let i=0;i<2;i++){
    const phase=i*1.25+.3;
    const radius=amp*(i===0?1:.88);
    const group=new THREE.Group();
    group.position.set(0,(i===0?1:-1)*h*.235,-1.8-i*.3);
    group.rotation.z=(i===0?1:-1)*.018;
    group.rotation.y=phase*.035;
    const pts=helixPoints(xMin,xMax,samples,radius,phase,0);
    const mats=[makeStrandMaterial(i===0?0xff7229:0xffa94d,phase,.98),makeStrandMaterial(i===0?0x35dfff:0x79baff,phase+1.7,.94)];
    const curveA=new THREE.CatmullRomCurve3(pts[0],false,'centripetal');
    const curveB=new THREE.CatmullRomCurve3(pts[1],false,'centripetal');
    const strandA=new THREE.Mesh(new THREE.TubeGeometry(curveA,samples,.047,8,false),mats[0]);
    const strandB=new THREE.Mesh(new THREE.TubeGeometry(curveB,samples,.043,8,false),mats[1]);
    group.add(strandA,strandB);
    const bridgePoints=[];
    for(let j=4;j<samples;j+=8){bridgePoints.push(pts[0][j],pts[1][j]);}
    const bridges=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(bridgePoints),bridgeMaterial);group.add(bridges);
    const beadCount=Math.floor(samples/beadStep)+1;
    const beadsA=new THREE.InstancedMesh(tubeSphere,atomMaterials[i===0?0:2],beadCount);
    const beadsB=new THREE.InstancedMesh(tubeSphere,atomMaterials[i===0?1:3],beadCount);
    beadsA.instanceMatrix.setUsage(THREE.StaticDrawUsage);beadsB.instanceMatrix.setUsage(THREE.StaticDrawUsage);
    const dummy=new THREE.Object3D();let n=0;
    for(let j=0;j<=samples;j+=beadStep){
     dummy.position.copy(pts[0][j]);dummy.scale.setScalar(j%(beadStep*2)===0?.105:.073);dummy.updateMatrix();beadsA.setMatrixAt(n,dummy.matrix);
     dummy.position.copy(pts[1][j]);dummy.scale.setScalar(j%(beadStep*2)===0?.096:.068);dummy.updateMatrix();beadsB.setMatrixAt(n,dummy.matrix);n++;
    }
    group.add(beadsA,beadsB);
    const atomHalo=new THREE.Mesh(new THREE.TorusGeometry(radius*.98,.012,5,96),new THREE.MeshBasicMaterial({color:i===0?0xff7c2c:0x42dfff,transparent:true,opacity:.1,blending:THREE.AdditiveBlending,depthWrite:false}));
    atomHalo.position.set(0,0,-.05);group.add(atomHalo);
    helixField.add(group);
    helixes.push({group,phase,radius,baseRadius:radius,index:i,mats,atomHalo});
   }
  }
  function addPlasmaRibbon(index,color,amp,phase,thickness,opacity){
   const pts=[];const segments=240;
   for(let j=0;j<=segments;j++){
    const f=j/segments;const x=(f-.5)*worldW*1.3;
    const y=Math.sin(f*Math.PI*2*(1.25+(index%3)*.28)+phase)*amp + Math.sin(f*Math.PI*2*3.1-phase)*amp*.24 + (f-.5)*(index%2===0?1:-1)*1.1;
    const z=-4.4-index*.24;
    pts.push(new THREE.Vector3(x,y,z));
   }
   const curve=new THREE.CatmullRomCurve3(pts,false,'centripetal');
   const geometry=new THREE.TubeGeometry(curve,segments,thickness,7,false);
   const material=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:phase},uColor:{value:new THREE.Color(color)},uPhase:{value:phase},uOpacity:{value:opacity}},
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,toneMapped:false,
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform float uTime;uniform vec3 uColor;uniform float uPhase;uniform float uOpacity;varying vec2 vUv;void main(){float streak=pow(max(0.0,sin(vUv.x*24.0-uTime*2.3+uPhase+sin(vUv.x*5.0+uPhase)*1.6)),8.0);float shiver=0.55+0.45*sin(vUv.x*7.0-uTime*.7+uPhase);vec3 col=uColor*(0.26+streak*2.25);float alpha=(0.14+streak*.75)*shiver*uOpacity;gl_FragColor=vec4(col,alpha);}`
   });
   const mesh=new THREE.Mesh(geometry,material);plasmaField.add(mesh);plasmaMaterials.push(material);
   // Wider transparent echo makes the moving path read as plasma, not a bare wire.
   const glowMat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:opacity*.16,blending:THREE.AdditiveBlending,depthWrite:false});
   const glow=new THREE.Mesh(new THREE.TubeGeometry(curve,segments,thickness*3.3,6,false),glowMat);plasmaField.add(glow);
  }
  function buildPlasma(){
   while(plasmaField.children.length){const obj=plasmaField.children[plasmaField.children.length-1];plasmaField.remove(obj);if(obj.geometry)obj.geometry.dispose();if(obj.material&&!Array.isArray(obj.material))obj.material.dispose();}
   plasmaMaterials.splice(0,plasmaMaterials.length);
   const colors=[0xff5a1f,0xff9f42,0x32cfff,0xffc16b,0xff4a21,0x45dfff];
   for(let i=0;i<4;i++)addPlasmaRibbon(i,colors[i],worldH*(.045+(i%3)*.018),i*1.31,.018+(i%3)*.008,.48-(i%3)*.06);
  }
  function buildParticles(){
   if(particleSystem){scene.remove(particleSystem);particleGeometry.dispose();particleSystem.material.dispose();}
   if(sparkSystem){scene.remove(sparkSystem);sparkGeometry.dispose();sparkSystem.material.dispose();}
   const count=clamp(Math.round(window.innerWidth*window.innerHeight/520),850,2600);
   particleGeometry=new THREE.BufferGeometry();particleBase=new Float32Array(count*3);particleSeed=new Float32Array(count);
   const colors=new Float32Array(count*3);
   for(let i=0;i<count;i++){
    const x=(Math.random()-.5)*worldW*1.12,y=(Math.random()-.5)*worldH*1.25,z=-5+Math.random()*8;
    particleBase[i*3]=x;particleBase[i*3+1]=y;particleBase[i*3+2]=z;particleSeed[i]=Math.random()*Math.PI*2;
    const type=Math.random();if(type<.68){colors[i*3]=1;colors[i*3+1]=.31+Math.random()*.32;colors[i*3+2]=.07;}else if(type<.9){colors[i*3]=.14;colors[i*3+1]=.68+Math.random()*.28;colors[i*3+2]=1;}else{colors[i*3]=1;colors[i*3+1]=.72;colors[i*3+2]=.35;}
   }
   particleGeometry.setAttribute('position',new THREE.BufferAttribute(new Float32Array(particleBase),3));particleGeometry.setAttribute('color',new THREE.BufferAttribute(colors,3));
   particleSystem=new THREE.Points(particleGeometry,new THREE.PointsMaterial({size:.036,vertexColors:true,transparent:true,opacity:.73,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));scene.add(particleSystem);
   const sparks=clamp(Math.round(window.innerWidth/8),70,210);sparkGeometry=new THREE.BufferGeometry();sparkBase=new Float32Array(sparks*3);const sparkColors=new Float32Array(sparks*3);
   for(let i=0;i<sparks;i++){sparkBase[i*3]=(Math.random()-.5)*worldW*1.12;sparkBase[i*3+1]=(Math.random()-.5)*worldH*1.2;sparkBase[i*3+2]=Math.random()*4-2;sparkColors[i*3]=1;sparkColors[i*3+1]=.3+Math.random()*.55;sparkColors[i*3+2]=.09;}
   sparkGeometry.setAttribute('position',new THREE.BufferAttribute(new Float32Array(sparkBase),3));sparkGeometry.setAttribute('color',new THREE.BufferAttribute(sparkColors,3));
   sparkSystem=new THREE.Points(sparkGeometry,new THREE.PointsMaterial({size:.075,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));scene.add(sparkSystem);
  }
  function layoutHelixes(){
   const {w,h}=visibleWorld();worldW=w;worldH=h;
   buildHelixes();buildPlasma();buildParticles();
  }
  buildHelixes();buildPlasma();buildParticles();
  let targetX=0,targetY=0,mouseX=0,mouseY=0;
  window.addEventListener('pointermove',e=>{targetX=(e.clientX/window.innerWidth-.5)*.28;targetY=-(e.clientY/window.innerHeight-.5)*.16;},{passive:true});
  let raf=0;const clock=new THREE.Clock();let lastDraw=0;
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));renderer.setSize(window.innerWidth,window.innerHeight);layoutHelixes();}
  window.addEventListener('resize',resize,{passive:true});
  function render(){
   raf=requestAnimationFrame(render);
   const t=clock.getElapsedTime();
   if(!reduceMotion){
    mouseX+=(targetX-mouseX)*.025;mouseY+=(targetY-mouseY)*.025;
    helixes.forEach((item,i)=>{
     const g=item.group;g.rotation.y=Math.sin(t*.19+item.phase)*.12+mouseX*.08;g.rotation.x=Math.sin(t*.15+item.phase*1.3)*.035+mouseY*.05;g.rotation.z=(i===0?1:-1)*.018+Math.sin(t*.18+item.phase)*.012;g.position.y=(i===0?1:-1)*worldH*.235+Math.sin(t*.24+item.phase)*.12;
     item.atomHalo.rotation.z=t*(i%2===0?.22:-.17)+item.phase;
    });
    strandMaterials.forEach(m=>m.uniforms.uTime.value=t);
    plasmaMaterials.forEach((m,i)=>m.uniforms.uTime.value=t*(.72+(i%3)*.22));
    glowOrange.intensity=6+Math.sin(t*2.1)*1.8;glowCyan.intensity=4.5+Math.cos(t*1.7)*1.5;
    if(particleGeometry){const arr=particleGeometry.attributes.position.array;for(let i=0;i<particleSeed.length;i++){const seed=particleSeed[i];arr[i*3]=particleBase[i*3]+Math.sin(t*.19+seed)*.13;arr[i*3+1]=particleBase[i*3+1]+Math.sin(t*.37+seed*1.7)*.2;}particleGeometry.attributes.position.needsUpdate=true;}
    if(sparkGeometry){const arr=sparkGeometry.attributes.position.array;for(let i=0;i<arr.length/3;i++){const seed=i*1.13;arr[i*3]=sparkBase[i*3]+Math.sin(t*.45+seed)*.22;arr[i*3+1]=sparkBase[i*3+1]+Math.cos(t*.39+seed*.8)*.24;}sparkGeometry.attributes.position.needsUpdate=true;}
   }
   renderer.render(scene,camera);
  }
  render();
  if(fallback)fallback.style.display='none';
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&raf){cancelAnimationFrame(raf);raf=0;}else if(!document.hidden&&!raf)render();});
 }catch(err){
  console.warn('Three.js unavailable; CSS molecular-helix field remains active.',err);
  canvas.style.display='none';
  showFallback();
 }
})();
